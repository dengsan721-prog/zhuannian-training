name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install
      - run: npm run build:pages
      - name: Create direct links for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          for route in join scenes commenting privacy service-boundary content-correction verify support progress favorites; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          mkdir -p dist/support/request dist/support/status dist/support/safety-report
          cp dist/index.html dist/support/request/index.html
          cp dist/index.html dist/support/status/index.html
          cp dist/index.html dist/support/safety-report/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
